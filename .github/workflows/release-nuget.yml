name: Release to NuGet

# Manual only: the package version comes from <Version> in src/GogNet/GogNet.csproj,
# so bump it there before running this.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: Restore
        run: dotnet restore GogNet.sln
      - name: Build
        run: dotnet build GogNet.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test GogNet.sln --configuration Release --no-build
      - name: Pack
        run: dotnet pack src/GogNet/GogNet.csproj --configuration Release --no-build --output artifacts
      - name: NuGet login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts\*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-Xml -Path src/GogNet/GogNet.csproj -XPath '//Version').Node.InnerText
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Create GitHub release
        shell: bash
        run: |
          gh release create "v${{ steps.version.outputs.version }}" artifacts/*.nupkg \
            --title "v${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
